name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Check formatting and module metadata
        run: |
          make fmt-check
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"
      - name: Test with race detection
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Fuzz the independent point model
        run: make fuzz
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          skip-cache: true
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Package verified source
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=set/ "$GITHUB_SHA" | gzip -n > dist/set-source.tar.gz
          cd dist
          sha256sum set-source.tar.gz > SHA256SUMS
      - name: Upload verified source
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-${{ github.sha }}
          path: |
            dist/set-source.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
