name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"] # STANDARD.md MOD-1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml .github/workflows/release.yml
      - name: Check (STANDARD.md MOD-5)
        run: make check
      - name: Fuzz the independent point model
        run: make fuzz
      - name: Package verified source
        if: github.event_name != 'pull_request' && matrix.go == '1.27.x'
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=set/ "$GITHUB_SHA" | gzip -n > dist/set-source.tar.gz
          cd dist
          sha256sum set-source.tar.gz > SHA256SUMS
      - name: Upload verified source
        if: github.event_name != 'pull_request' && matrix.go == '1.27.x'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-${{ github.sha }}
          path: |
            dist/set-source.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          overwrite: true
