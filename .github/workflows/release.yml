name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable version tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          awk -v tag="$RELEASE_TAG" 'index($0, "## " tag " ") == 1 { found = 1 } END { exit !found }' CHANGELOG.md

  verify:
    name: Verify tagged source
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified source
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's verified source
        uses: actions/download-artifact@v8.0.2
        with:
          name: source-${{ github.sha }}
          path: dist
      - name: Verify checksums and source commit
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(gzip -dc dist/set-source.tar.gz | git get-tar-commit-id)" = "$GITHUB_SHA"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - name: Prepare release notes
        run: |
          awk -v tag="$RELEASE_TAG" '
            index($0, "## " tag " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nSource commit: %s\n\n[Verified CI run](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
      - name: Create or resume draft and verify uploaded assets
        run: |
          if draft_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2> "$RUNNER_TEMP/release-lookup.err")"; then
            printf 'Existing release: draft=%s\n' "$draft_state"
          else
            if ! gh release create "$RELEASE_TAG" --draft --verify-tag \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md; then
              cat "$RUNNER_TEMP/release-lookup.err"
              exit 1
            fi
            draft_state=true
          fi

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > asset-names.txt
          mkdir -p release-check
          for asset in set-source.tar.gz SHA256SUMS; do
            if grep -Fxq "$asset" asset-names.txt; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir release-check
              cmp "dist/$asset" "release-check/$asset"
            else
              # Published releases must already be complete; only resume drafts.
              test "$draft_state" = true
              gh release upload "$RELEASE_TAG" "dist/$asset"
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir release-check
              cmp "dist/$asset" "release-check/$asset"
            fi
          done
          (cd release-check && sha256sum --check SHA256SUMS)
          if [ "$draft_state" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url'
